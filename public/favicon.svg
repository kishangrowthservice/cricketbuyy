<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBorderFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FEDB37" />
    </linearGradient>

    <radialGradient id="ballGradientFav" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="40%" stop-color="#c81428" />
      <stop offset="85%" stop-color="#800a18" />
      <stop offset="100%" stop-color="#4a020b" />
    </radialGradient>

    <linearGradient id="orbitGradientFav" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Crest Shield Base -->
  <path d="M 36,2 L 66,16 L 66,48 L 36,70 L 6,48 L 6,16 Z"
        fill="#14191E"
        stroke="url(#shieldBorderFav)"
        stroke-width="2.5" />

  <!-- Shield Inner Fill Accent -->
  <path d="M 36,6 L 62,18 L 62,46 L 36,65 L 10,46 L 10,18 Z"
        fill="#1C060A"
        opacity="0.9" />

  <!-- 3D Cricket Ball (Core Sphere) -->
  <circle cx="36" cy="34" r="22" fill="url(#ballGradientFav)" />

  <!-- Cricket Ball Seam Stitching (Curved dashed trajectory) -->
  <path d="M 20,20 C 31,24 41,38 48,50"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="1 3.5"
        opacity="0.95" />

  <!-- Ball Seam Ridge Highlight -->
  <path d="M 21,19 C 32,23 42,37 49,49"
        fill="none"
        stroke="#FFD700"
        stroke-width="0.8"
        opacity="0.6" />

  <!-- Dynamic Upward Orbit / Exchange Buy Swoosh -->
  <path d="M 12,48 C 15,62 38,62 55,44 C 64,34 66,22 62,14"
        fill="none"
        stroke="url(#orbitGradientFav)"
        stroke-width="3"
        stroke-linecap="round" />

  <!-- Orbit Arrowhead (Trading Momentum Upward) -->
  <polygon points="61,10 68,14 62,18" fill="#FFF2A3" />
</svg>
